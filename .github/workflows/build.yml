name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs, Play Store bundle and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease :companyready:bundleRelease :companyready:testReleaseUnitTest
          cp app/build/outputs/apk/release/app-release.apk AppPilot.apk
          cp companyready/build/outputs/apk/release/companyready-release.apk CompanyReadyUK.apk
          cp companyready/build/outputs/bundle/release/companyready-release.aab CompanyReadyUK.aab

      - uses: actions/upload-artifact@v4
        with:
          name: AppPilot-apk
          path: AppPilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CompanyReadyUK
          path: |
            CompanyReadyUK.apk
            CompanyReadyUK.aab

      - name: Publish "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AppPilot.apk \
            --title "AppPilot – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download AppPilot.apk on your phone and open it to install." \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish "company-ready-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete company-ready-latest --cleanup-tag --yes || true
          gh release create company-ready-latest CompanyReadyUK.apk CompanyReadyUK.aab \
            --title "Company Ready UK – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download CompanyReadyUK.apk on your phone to install. CompanyReadyUK.aab is the bundle format Google Play uses (sign it with your own upload key for a real release)." \
            --prerelease --target "$GITHUB_SHA"

  smoke-test:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AppPilot-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/

  companyready-smoke-test:
    name: Company Ready UK emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CompanyReadyUK

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/companyready-smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companyready-screenshots
          path: screenshots-companyready/

  companyready-links:
    name: Company Ready UK link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every web link in the app
        run: bash .github/scripts/check-links.sh
