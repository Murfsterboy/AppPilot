name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AppPilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppPilot-apk
          path: AppPilot.apk

      - name: Publish "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AppPilot.apk \
            --title "AppPilot – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download AppPilot.apk on your phone and open it to install." \
            --prerelease --target "$GITHUB_SHA"
