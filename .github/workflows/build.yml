name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AppPilot.apk
          cp trainer-android/build/outputs/apk/release/trainer-android-release.apk BenchTrainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppPilot-apk
          path: AppPilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BenchTrainer-apk
          path: BenchTrainer.apk

      - name: Publish "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AppPilot.apk \
            --title "AppPilot – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download AppPilot.apk on your phone and open it to install." \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish "trainer-latest" release (Bench Trainer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete trainer-latest --cleanup-tag --yes || true
          gh release create trainer-latest BenchTrainer.apk \
            --title "Bench Trainer – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download BenchTrainer.apk on your phone and open it to install." \
            --prerelease --target "$GITHUB_SHA"

  smoke-test:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AppPilot-apk

      - uses: actions/download-artifact@v4
        with:
          name: BenchTrainer-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/trainer-smoke-test.sh
            bash .github/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/
