<style>@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}@font-face{font-family:Inter;src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}</style>
<style>
/* Layout: single phone-width column app, sticky top bar, fixed bottom tab bar; widens to a centred 480px card on desktop */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --sunk:#E9E7E1; --line:#E0DDD5;
  --ink:#1A2326; --muted:#566065; --teal:#0F5C55; --teal-soft:#E3F0EE; --on-teal:#FFFFFF;
  --tape:#F5C518; --on-tape:#1A2326; --tape-soft:#FFF4C7;
  --warn:#9A2C14; --warn-soft:#FBE7E2; --dark:#1A2326; --on-dark:#FFFFFF; --on-dark-muted:#C3CBCE;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111819; --surface:#1A2326; --sunk:#232E31; --line:#2E3A3E;
  --ink:#ECEFEF; --muted:#A3AEB1; --teal:#5FB8AD; --teal-soft:#183331; --on-teal:#0B1415;
  --tape:#F5C518; --on-tape:#1A2326; --tape-soft:#3A3315;
  --warn:#F2957F; --warn-soft:#3A1F19; --dark:#0B1112; --on-dark:#ECEFEF; --on-dark-muted:#A3AEB1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111819; --surface:#1A2326; --sunk:#232E31; --line:#2E3A3E;
  --ink:#ECEFEF; --muted:#A3AEB1; --teal:#5FB8AD; --teal-soft:#183331; --on-teal:#0B1415;
  --tape:#F5C518; --on-tape:#1A2326; --tape-soft:#3A3315;
  --warn:#F2957F; --warn-soft:#3A1F19; --dark:#0B1112; --on-dark:#ECEFEF; --on-dark-muted:#A3AEB1; color-scheme:dark}
*{box-sizing:border-box}
svg{stroke:currentColor}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.top h1,.top .ttl{margin:0;font-family:var(--display);font-weight:700;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.5px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--tape);display:grid;place-items:center}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{stroke:var(--ink)}
main{display:flex;flex-direction:column;gap:20px;padding-block:4px 24px}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-wrap:balance}
.h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.6px;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--teal);color:var(--on-teal);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero p{margin:0;opacity:.9}
.hero h2{font-size:24px;line-height:1.15}
.dark{background:var(--dark);color:var(--on-dark);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dark .sub{color:var(--on-dark-muted)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.tape{background:var(--tape);color:var(--on-tape)}
.tag.teal{background:var(--teal-soft);color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:none;font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.tape{background:var(--tape);color:var(--on-tape)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.hero .btn.ghost{border-color:rgba(255,255,255,.5);color:var(--on-teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:100px;color:var(--ink);text-decoration:none}
.tile .num{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#1A2326}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:3px}
.tip{background:var(--tape-soft);border-radius:14px;padding:14px 16px;display:flex;gap:12px}
.tip svg{flex:none;stroke:var(--ink)}
.warnbox{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;gap:10px}
.warnbox svg{flex:none;stroke:var(--warn);margin-top:2px}
.okbox{background:var(--teal-soft);border-radius:14px;padding:14px 16px;color:var(--ink)}
.okbox .eyebrow{color:var(--teal)}
.photo{position:relative;border-radius:18px;aspect-ratio:16/10;max-width:100%;background-color:var(--sunk);background-image:repeating-linear-gradient(135deg,rgba(127,127,127,.09) 0 10px,transparent 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;overflow:hidden}
.photo svg{stroke:var(--muted)}
.photo span{font-size:13px;color:var(--muted);max-width:280px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.fact small{font-size:12px;color:var(--muted)}
.fact b{font-size:14px}
.check{display:flex;align-items:center;gap:12px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--teal);margin:0;flex:none}
.check span{flex:1;min-width:0}
.check.done span{color:var(--muted);text-decoration:line-through}
.steplist{display:flex;flex-direction:column}
.steplist button{display:flex;align-items:center;gap:12px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:48px}
.dot{width:28px;height:28px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.dot.done{background:var(--teal);color:var(--on-teal)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:12px}
.seg button{min-height:40px;border-radius:9px;border:none;background:transparent;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
ol.instr{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.instr li{display:flex;gap:12px;font-size:16px;line-height:1.5;counter-increment:s}
ol.instr li::before{content:counter(s);width:26px;height:26px;border-radius:13px;background:var(--tape);color:var(--on-tape);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;margin-top:1px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--teal)}
.progress i.cur{background:var(--ink)}
.stepfoot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.stepfoot .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500;min-height:56px}
.tabs a svg{stroke:currentColor}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs a[aria-current="page"] svg{stroke:var(--teal)}
.prod{display:flex;gap:14px}
.tin{width:64px;height:84px;border-radius:10px;flex:none;background:var(--sunk);display:grid;place-items:center}
.tin svg{stroke:var(--muted)}
.prod .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;align-items:center;gap:12px}
.timer .big{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,15,16,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt .t{display:flex;flex-direction:column;flex:1;min-width:0}
.opt .t b{font-size:15px}
.opt .t small{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.badge.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0}
.search svg{stroke:var(--muted)}
@media (prefers-reduced-motion: no-preference){main{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

const ic = (n, s=20, w=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- content ----------
const P = {
  zmk:{name:'Zinsser Mould Killer & Remover',type:'Fungicidal wash',use:'Kills mould and mildew on walls and ceilings before you decorate.',tags:['Step 1 of mould system','Ready to use'],for:['mould']},
  bin:{name:'Zinsser B-I-N',type:'Shellac primer-sealer',use:'Blocks water marks, smoke, nicotine, marker and mould stains so they don’t bleed through emulsion. Dries fast.',tags:['Stain block','Clean brushes with meths'],for:['mould','stains','damp']},

  lwfill:{name:'Lightweight ready-mixed filler',type:'Filler',use:'For holes and dents. No shrinkage in deep fills, easy to sand.',tags:['Holes','Ready to use'],for:['cracks','smooth','plaster']},

  caulk:{name:'Decorators’ caulk',type:'Flexible sealant',use:'Fills gaps at corners, skirting and around frames. Paintable. Not for flat wall surfaces.',tags:['Joints','Paintable'],for:['smooth','newplaster']},

const G = {
mould:{cat:'mould',title:'Treat mould on walls and stop it coming back',short:'Mould & mildew',level:'Easy',time:'2–3 h',dry:'1–2 days',cost:'££',skill:'Mould treatment',
 cause:'Mould needs moisture. If it’s condensation, improve ventilation. If it’s a leak, rising or penetrating damp, fix that before you decorate or the mould will come back.',
 safety:['Gloves','Goggles','FFP3 mask','Windows open'],
 kit:[['zmk'],['bin'],['pw'],'Disposable cloths','Heavy-duty bin bags','Dust sheets & masking tape','Synthetic brush and short-pile roller','Methylated spirits (cleans shellac brushes)'],
 steps:[
  {t:'Find and fix the moisture',shot:'Condensation beading on a cold window reveal next to mould spots',
   b:['Look at where the mould is. Corners of outside walls, window reveals, behind furniture and bathrooms usually mean condensation.','A patch that gets worse after rain points to penetrating damp. A tide mark low on a ground-floor wall points to rising damp.','Fix leaks and damp before you treat the mould. For condensation, carry on: step 8 covers ventilation.'],
   p:['Map the affected areas and note the orientation of the walls. Cold north-facing external walls and thermal bridges at lintels are classic.','Check trickle vents, extractor run-on, and whether furniture is tight to external walls.','A pin meter reads high on salts and foil-backed surfaces: compare readings against a known-dry area, not absolute numbers.'],
   mistake:'Painting over mould without fixing the moisture. It’ll be back within months.'},
  {t:'Protect the room and yourself',shot:'Gloves, goggles and an FFP3 mask laid out on a dust sheet',
   b:['Open the windows and close the door to the rest of the house.','Put on gloves, goggles and an FFP3 mask.','Move furniture away and lay a dust sheet under the wall.'],
   p:['Mask adjacent surfaces and sockets. Bag soft furnishings that have mould on them separately.','Anyone with asthma or a weak immune system should stay out while you work.']},
  {t:'Kill the mould. Wet it, never dry-brush it.',shot:'Spraying a mouldy corner from about 20 cm away',timer:10,timerLabel:'Mould wash contact time',
   b:['Shake the mould killer and spray until the area looks damp, not dripping.','Spray about 30 cm past the mould you can see. Spores spread further than the spots.','Leave it for the time on the label. Set the timer below to match.'],
   p:['On large areas use a pump sprayer and work top-down in 1 m² sections.','Keep to the label contact time and don’t dilute unless the label allows it.','Mould in silicone or grout usually means replacing the sealant, not treating it.'],
   mistake:'Sanding or brushing mould off first. It throws spores into the air. Always treat it wet.'},
  {t:'Wipe off and bag the waste',shot:'Folding a cloth to a clean face while wiping down the treated wall',

  {t:'Let the wall dry right out',shot:'A dehumidifier running in a room with the window open',timer:1440,timerLabel:'Wall drying',

const tabs = (cur) => {
  const t = [['home','Home','home'],['diagnose','Diagnose','scan'],['products','Products','tin'],['stores','Stores','pin'],['projects','My jobs','user']];
  return `<nav class="tabs" aria-label="Main"><div class="in">${t.map(([h,l,i]) => `<a href="#${h}" ${cur===h?'aria-current="page"':''}>${ic(i,22)}<span>${l}</span></a>`).join('')}</div></nav>`;
};
const photo = (caption, src) => `<div class="photo">${src ? `<img src="${src}" alt="Your wall photo">` : `${ic('camera',28)}<span>Photo slot: ${esc(caption)}</span>`}</div>`;

// ---------- views ----------
function vHome(){
  const active = Object.keys(G).filter(g => done(g).length && done(g).length < G[g].steps.length);
  const cont = S.last && G[S.last.g] ? S.last : (active[0] ? {g:active[0], i:done(active[0]).length} : null);
  const tip = TIPS[new Date().getDate() % TIPS.length];
  const timer = S.timers.find(t => t.end > Date.now());
  return `
  <header class="top wrap"><a class="logo" href="#home" aria-label="Fettle home"><span class="mark">${ic('logo',18,2.2).replace('stroke-width','stroke="#1A2326" stroke-width')}</span><b>Fettle</b></a>
    <button class="icon-btn" data-act="level" aria-label="Change your level">${ic('user',20)}</button></header>
  <main class="wrap">
    <div class="stack">
      <h1 class="h1">What are we fixing today?</h1>
      <button class="chip" data-act="level" style="align-self:flex-start">Your level: ${levelName[S.level] || 'Not set'} ▾</button>
    </div>
    <section class="hero">
      <span class="tag tape" style="align-self:flex-start">Wall Doctor</span>
      <h2>Tell us what’s wrong. Get a prep plan for your wall.</h2>
      <p>Damp, mould, blown plaster, cracks: we’ll work out the cause, the steps and exactly what to buy.</p>
      <div class="row" style="flex-wrap:wrap"><a class="btn tape" href="#diagnose">${ic('scan',20)} Diagnose a wall</a></div>
    </section>
    ${cont ? `<a class="card" href="#step-${cont.g}-${Math.min(cont.i, G[cont.g].steps.length-1)+1}" style="text-decoration:none;color:inherit">
      <div class="between"><span class="eyebrow">Carry on</span><span class="muted" style="font-size:13px">${G[cont.g].short}</span></div>
      <b style="font-size:16px">Step ${Math.min(cont.i, G[cont.g].steps.length-1)+1} of ${G[cont.g].steps.length}: ${G[cont.g].steps[Math.min(cont.i, G[cont.g].steps.length-1)].t}</b>
      ${timer ? `<span class="muted row" style="font-size:14px;gap:6px">${ic('clock',14)} ${esc(timer.label)}: <span data-timer="${timer.end}">${fmt(timer.end-Date.now())}</span> left</span>` : ''}
      <div class="bar"><i style="width:${pct(cont.g)}%"></i></div></a>` : ''}
    <section class="stack">
      <div class="between"><h2>Walls: prep &amp; repair</h2><span class="muted" style="font-size:13px">8 guides</span></div>
      <div class="grid2">${PROBLEMS.map(p => `<a class="tile" href="#guide-${p.id}"><span class="num" style="background:${p.tint}">${p.n}</span><b>${p.title}</b><small>${G[p.id].steps.length} steps · ${G[p.id].level}${pct(p.id) ? ' · ' + pct(p.id) + '%' : ''}</small></a>`).join('')}</div>
    </section>
    <section class="stack">
      <h2>Coming next</h2>
      <div class="dark">
        <b style="font-size:17px">Woodwork</b>
        <span class="sub" style="font-size:14px">Strip, treat, repair and paint doors, skirting, frames and windows.</span>
        <button class="btn tape sm" data-act="notify" style="align-self:flex-start">${S.notify ? ic('check',16,2.6) + ' We’ll tell you' : 'Notify me'}</button>
      </div>
    </section>
    <section class="tip">${ic('bulb',24)}<div class="stack" style="gap:4px"><b style="font-size:14px">Pro trick of the day</b><span style="font-size:14px">${tip}</span></div></section>
  </main>${tabs('home')}`;
}

function vDiagnose(){
  const q = ui.quiz, quiz = q.problem && QUIZ[q.problem];
  let result = null;
  if (q.problem) {
    if (!quiz) result = {r:[q.problem], note:null};
    else if (q.answer != null) result = quiz.opts[q.answer];
  }
  return `${top('Wall Doctor')}
  <main class="wrap">
    <section class="stack">
      ${photo('Take or upload a photo of the problem area', ui.photo)}
      <label class="btn ghost block" for="photo-in">${ic('camera',20)} ${ui.photo ? 'Change photo' : 'Add a photo of your wall'}</label>
      <input id="photo-in" type="file" accept="image/*" class="sr">
      <p class="muted" style="margin:0;font-size:13px">Automatic photo diagnosis is coming in a later version. For now, pick what you can see below.</p>
    </section>
    <section class="stack" aria-label="What can you see">
      <h2>What can you see?</h2>
      ${PROBLEMS.map(p => `<button class="opt" data-act="pick" data-id="${p.id}" aria-pressed="${q.problem===p.id}"><span class="num" style="width:36px;height:36px;border-radius:9px;background:${p.tint};display:grid;place-items:center;font-weight:700;font-size:13px;color:#1A2326;flex:none">${p.n}</span><span class="t"><b>${p.title}</b><small>${p.looks}</small></span></button>`).join('')}
    </section>
    ${quiz ? `<section class="card">
      <span class="eyebrow">Quick check: find the cause</span>
      <b style="font-size:16px">${quiz.q}</b>
      <div class="stack" style="gap:8px">${quiz.opts.map((o,i) => `<button class="opt" data-act="answer" data-i="${i}" aria-pressed="${q.answer===i}"><span class="t"><b>${o.l}</b></span></button>`).join('')}</div>
    </section>` : ''}
    ${result ? `<section class="stack" id="plan">
      ${result.note ? `<div class="${result.warn ? 'warnbox' : 'okbox'}">${result.warn ? ic('warn',20) : ''}<div><span class="eyebrow">Our read</span><div style="font-size:15px;margin-top:2px">${result.note}</div></div></div>` : ''}
      <h2>Your prep plan</h2>
      ${result.r.map((g,i) => `<a class="card" href="#guide-${g}" style="text-decoration:none;color:inherit;flex-direction:row;align-items:center"><span class="dot">${i+1}</span><span style="flex:1;min-width:0"><b style="display:block">${G[g].title}</b><small class="muted">${G[g].steps.length} steps · ${G[g].time}</small></span>${ic('arrow',18)}</a>`).join('')}
    </section>` : ''}
  </main>${tabs('diagnose')}`;
}

function vGuide(gid){
  const g = G[gid]; if (!g) return vHome();
  const d = done(gid);
  const missing = g.kit.filter(k => !S.have[gid + '|' + kitName(k)]);
  const next = Math.min(d.length, g.steps.length - 1) + 1;
  return `${top(g.short, 'home')}
  <main class="wrap">
    ${photo('Before and after of this repair')}
    <div class="stack" style="gap:6px"><span class="eyebrow" style="color:var(--teal)">Walls · ${g.short}</span><h1 class="h1" style="font-size:27px">${g.title}</h1></div>
    <div class="facts">${[['Level',g.level],['Hands-on',g.time],['Drying',g.dry],['Cost',g.cost]].map(([k,v]) => `<div class="fact"><small>${k}</small><b>${v}</b></div>`).join('')}</div>
    <section class="tip">${ic('warn',22)}<div class="stack" style="gap:4px"><b>Before you start</b><span style="font-size:14px">${g.cause}</span></div></section>
    <section class="stack"><h2>Stay safe</h2><div class="chips">${g.safety.map(s => `<span class="badge">${s}</span>`).join('')}</div></section>
    <section class="card">
      <div class="between"><h2>You’ll need</h2><span class="muted" style="font-size:13px">${g.kit.length - missing.length} of ${g.kit.length} got</span></div>
      <div>${g.kit.map((k,i) => { const n = kitName(k), id = 'kit-' + gid + '-' + i, have = !!S.have[gid + '|' + n];
        return `<label class="check ${have?'done':''}" for="${id}"><input type="checkbox" id="${id}" data-act="have" data-key="${esc(gid + '|' + n)}" ${have?'checked':''}><span>${esc(n)}</span>${Array.isArray(k) ? '<span class="tag tape">Specialist</span>' : ''}</label>`; }).join('')}</div>
      <button class="btn tape block" data-act="addmissing" data-g="${gid}" ${missing.length ? '' : 'disabled'}>${missing.length ? 'Add ' + missing.length + ' missing to shopping list' : 'You’ve got everything'}</button>
    </section>
    <section class="stack" style="gap:4px">
      <div class="between" style="margin-bottom:6px"><h2>The ${g.steps.length} steps</h2><span class="muted" style="font-size:13px">${pct(gid)}% done</span></div>
      <div class="steplist">${g.steps.map((s,i) => `<button data-go="step-${gid}-${i+1}"><span class="dot ${d.includes(i)?'done':''}">${d.includes(i) ? ic('check',14,3).replace('<svg','<svg style="stroke:currentColor"') : i+1}</span><span style="flex:1;font-weight:500">${s.t}</span>${s.timer ? `<span class="muted" style="font-size:12px">${ic('clock',14)}</span>` : ''}</button>`).join('')}</div>
    </section>
    <a class="btn primary block" href="#step-${gid}-${next}">${d.length ? 'Continue from step ' + next : 'Start guide'} ${ic('arrow',18,2.4).replace('<svg','<svg style="stroke:currentColor"')}</a>
  </main>${tabs('')}`;
}

function vStep(gid, n){
  const g = G[gid]; if (!g) return vHome();
  const i = Math.max(0, Math.min(g.steps.length - 1, n - 1)), s = g.steps[i];
  const mode = ui.mode || (S.level === 'pro' ? 'pro' : 'beginner');
  const timer = S.timers.find(t => t.id === gid + '-' + i);
  const isDone = done(gid).includes(i);
  S.last = {g:gid, i}; save();
  const tdef = s.timer ? (timer ? `<span class="big" data-timer="${timer.end}">${fmt(timer.end - Date.now())}</span>` : `<span class="big">${fmt(s.timer*60000)}</span>`) : '';
  return `
  <header class="top wrap" style="flex-direction:column;align-items:stretch;gap:10px">
    <div class="row"><a class="icon-btn" href="#guide-${gid}" aria-label="Close and go to guide overview">${ic('close',18,2.4)}</a><span class="ttl" style="text-align:center;font-family:var(--body);font-size:15px;font-weight:600">Step ${i+1} of ${g.steps.length}</span><button class="icon-btn" data-act="speak" aria-label="Read this step aloud">${ic('sound',20)}</button></div>
    <div class="progress" aria-hidden="true">${g.steps.map((_,k) => `<i class="${k===i?'cur':done(gid).includes(k)?'on':''}"></i>`).join('')}</div>
  </header>
  <main class="wrap" style="padding-bottom:96px">
    ${photo(s.shot)}
    <h1 class="h1" style="font-size:25px">${s.t}</h1>
    <div class="seg" role="group" aria-label="Detail level">
      <button data-act="mode" data-m="beginner" aria-pressed="${mode==='beginner'}">Beginner</button>
      <button data-act="mode" data-m="pro" aria-pressed="${mode==='pro'}">Pro</button>
    </div>
    <ol class="instr" id="instr">${(mode==='pro' ? s.p : s.b).map(t => `<li><span>${t}</span></li>`).join('')}</ol>
    ${mode==='pro'
      ? `<section class="dark"><span class="eyebrow" style="color:var(--tape)">Pro note</span><span style="font-size:14px">Switch to Beginner for the plain-English version of this step.</span></section>`
      : `<section class="okbox"><span class="eyebrow">Want the trade detail?</span><div style="font-size:14px;margin-top:2px">Switch to Pro for faster methods and the checks decorators use.</div></section>`}
    ${s.mistake ? `<section class="warnbox">${ic('no',20,2.2)}<span style="font-size:14px"><strong>Common mistake:</strong> ${s.mistake}</span></section>` : ''}
    ${s.timer ? `<section class="card"><div class="timer">${ic('clock',28)}<div style="flex:1;min-width:0"><b style="display:block">${s.timerLabel}</b><small class="muted">Check the time on your product label</small></div>${tdef}</div>
      <div class="row">${timer ? `<button class="btn ghost sm" data-act="stoptimer" data-id="${gid}-${i}" style="flex:1">Cancel timer</button>` : `<button class="btn teal sm" data-act="starttimer" data-g="${gid}" data-i="${i}" style="flex:1">Start timer</button>`}</div></section>` : ''}
    <section class="card"><b>Stuck on this step?</b><span class="muted" style="font-size:14px">Photo questions are coming in a later version. For now, check the Pro view or the product label.</span></section>
  </main>
  <div class="stepfoot wrap"><div class="in">
    ${i > 0 ? `<a class="btn ghost" href="#step-${gid}-${i}" style="flex:1">Back</a>` : `<a class="btn ghost" href="#guide-${gid}" style="flex:1">Overview</a>`}
    <button class="btn primary" data-act="next" data-g="${gid}" data-i="${i}" style="flex:2">${i === g.steps.length-1 ? 'Finish guide' : (isDone ? 'Next step' : 'Done, next step')}</button>
  </div></div>`;
}

function vDone(gid){
  const g = G[gid];
  return `${top('Guide complete','home')}
  <main class="wrap">
    <section class="hero" style="align-items:flex-start">
      <span class="tag tape">Skill earned</span>
      <h2>${g.skill}</h2>
      <p>Nice work. Take an after photo and compare it with where you started.</p>
    </section>
    <div class="card"><b>What next?</b>
      ${gid !== 'smooth' ? `<a class="btn ghost block" href="#guide-smooth">Get the wall glass-smooth</a>` : ''}
      <a class="btn ghost block" href="#projects">See your skills and jobs</a>
      <a class="btn primary block" href="#home">Back to home</a></div>
  </main>${tabs('')}`;
}

function vProducts(){
  const f = ui.pfilter, q = ui.q.trim().toLowerCase();
  const filters = [['all','All'],['mould','Mould'],['stains','Stains'],['damp','Damp'],['plaster','Plaster repair'],['cracks','Cracks'],['newplaster','New plaster'],['flaking','Powdery walls'],['smooth','Smooth finish']];
  const list = Object.entries(P).filter(([id,p]) => (f==='all' || p.for.includes(f)) && (!q || (p.name + ' ' + p.type + ' ' + p.use).toLowerCase().includes(q)));
  return `${top('Specialist paints & primers')}
  <main class="wrap">
    <label class="search" for="psearch">${ic('search',18)}<span class="sr">Search products</span><input id="psearch" type="search" placeholder="Search a product or a problem" value="${esc(ui.q)}" data-act="search"></label>
    <div class="chips">${filters.map(([id,l]) => `<button class="chip" data-act="pfilter" data-f="${id}" aria-pressed="${f===id}">${l}</button>`).join('')}</div>
    ${(f==='all' || f==='mould') && !q ? `<section class="dark">
      <span class="eyebrow" style="color:var(--tape)">The mould system</span>
      <b style="font-family:var(--display);font-size:20px;line-height:1.2">Three products, in this order. Skip one and it may come back.</b>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[['Kill','zmk'],['Block','bin'],['Protect','pw']].map(([v,id],i) => `<div style="background:rgba(255,255,255,.07);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px"><span class="dot" style="background:var(--tape);color:var(--on-tape);width:24px;height:24px;font-size:12px">${i+1}</span><b style="font-size:14px">${v}</b><span class="sub" style="font-size:12px;line-height:1.3">${P[id].name.replace('Zinsser ','')}</span></div>`).join('')}</div>
      <button class="btn tape" data-act="addsys">Add the system to my list</button></section>` : ''}
    ${list.length ? list.map(([id,p]) => `<article class="card prod"><div class="tin">${ic('tin',26)}</div><div class="body">
      <span class="muted" style="font-size:12px;font-weight:600">${p.type}</span><b style="font-size:16px;line-height:1.25">${p.name}</b>
      <span style="font-size:14px">${p.use}</span>
      <div class="chips" style="gap:6px">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="row" style="flex-wrap:wrap;margin-top:4px">
        <button class="btn ${inList(p.name)?'ghost':'tape'} sm" data-act="addp" data-id="${id}">${inList(p.name) ? ic('check',16,2.6).replace('<svg','<svg style="stroke:currentColor"') + ' On your list' : 'Add to list'}</button>
        <a class="btn ghost sm" href="${searchUrl(p.name)}" target="_blank" rel="noopener">Find stockists ${ic('ext',14).replace('<svg','<svg style="stroke:currentColor"')}</a>
      </div></div></article>`).join('') : `<div class="card"><b>No matches</b><span class="muted">Try another word, or pick All.</span></div>`}
    <p class="muted" style="margin:0;font-size:13px">Recommendations are matched to the problem. Nothing here is a paid placement. Always follow the label for coverage, drying times and safety.</p>
  </main>${tabs('products')}`;
}

  const f = ui.sfilter;
  const list = STORES.filter(s => f==='all' || s.kind===f);

    <div class="chips">${[['all','All'],['merchant','Decorators’ merchants'],['diy','DIY stores'],['trade','Trade counters']].map(([id,l]) => `<button class="chip" data-act="sfilter" data-f="${id}" aria-pressed="${f===id}">${l}</button>`).join('')}</div>
    ${list.map(s => `<article class="card">
      <div class="row" style="align-items:flex-start"><span class="dot" style="background:${s.kind==='merchant'?'var(--teal)':'var(--tape)'};color:${s.kind==='merchant'?'var(--on-teal)':'var(--on-tape)'}">${ic('pin',14,2.4).replace('<svg','<svg style="stroke:currentColor"')}</span>
      <div style="flex:1;min-width:0"><b style="font-size:16px;display:block">${s.name}</b><small class="muted">${KIND[s.kind]}</small></div></div>
      <span style="font-size:14px">${s.why}</span>
      <a class="btn primary sm" href="${mapsUrl(s.name)}" target="_blank" rel="noopener">Find nearest on the map ${ic('ext',14).replace('<svg','<svg style="stroke:currentColor"')}</a>

    <p class="muted" style="margin:0;font-size:13px">Opens Google Maps in a new tab. Live stock checks would come from retailer feeds in the full app.</p>

function vProjects(){
  const active = Object.keys(G).filter(g => done(g).length);
  const timers = S.timers.slice().sort((a,b) => a.end - b.end);
  const allSkills = Object.values(G).map(g => g.skill);
  return `${top('My jobs')}
  <main class="wrap">
    <section class="stack">
      <h2>In progress</h2>
      ${active.length ? active.map(g => `<a class="card" href="#guide-${g}" style="text-decoration:none;color:inherit">
        <div class="between"><b style="font-size:16px">${G[g].short}</b><span style="font-weight:600;color:var(--teal);font-size:14px">${pct(g)}%</span></div>
        <div class="bar"><i style="width:${pct(g)}%"></i></div>
        <small class="muted">${done(g).length} of ${G[g].steps.length} steps done</small></a>`).join('')
      : `<div class="card"><b>No jobs started yet</b><span class="muted" style="font-size:14px">Start a guide and your progress shows up here.</span><a class="btn tape" href="#diagnose">Diagnose a wall</a></div>`}
    </section>
    ${timers.length ? `<section class="dark"><span class="eyebrow" style="color:var(--tape)">Drying timers</span>
      ${timers.map(t => `<div class="between" style="font-size:15px;align-items:center"><span>${esc(t.label)}</span><span class="row" style="gap:8px"><b data-timer="${t.end}" style="font-variant-numeric:tabular-nums">${fmt(t.end-Date.now())}</b><button class="btn sm" data-act="stoptimer" data-id="${t.id}" aria-label="Remove timer ${esc(t.label)}" style="background:rgba(255,255,255,.1);color:var(--on-dark);min-height:36px;padding:0 10px">${ic('close',14,2.4).replace('<svg','<svg style="stroke:currentColor"')}</button></span></div>`).join('')}
      <span class="sub" style="font-size:13px">${N ? 'We’ll send you a notification when each one is ready.' : 'Keep this page open to watch them count down.'}</span></section>` : ''}
    <section class="card">
      <div class="between"><h2>Shopping list</h2><span class="muted" style="font-size:13px">${S.list.filter(i=>i.got).length} of ${S.list.length} got</span></div>
      ${S.list.length ? `<div>${S.list.map((it,k) => `<label class="check ${it.got?'done':''}" for="sl-${k}"><input type="checkbox" id="sl-${k}" data-act="got" data-k="${k}" ${it.got?'checked':''}><span>${esc(it.name)}</span><button class="icon-btn" data-act="rm" data-k="${k}" aria-label="Remove ${esc(it.name)}" style="width:36px;height:36px;border:none;background:transparent">${ic('close',14,2.4)}</button></label>`).join('')}</div>
        <div class="row" style="flex-wrap:wrap"><button class="btn ghost sm" data-act="copylist" style="flex:1">${ic('copy',16).replace('<svg','<svg style="stroke:currentColor"')} ${N ? 'Share list' : 'Copy list'}</button><a class="btn primary sm" href="#stores" style="flex:1">Where to buy</a></div>`
      : `<span class="muted" style="font-size:14px">Add products from a guide’s kit list or the Products tab.</span>`}
    </section>
    <section class="stack">
      <div class="between"><h2>Skills</h2><span class="muted" style="font-size:13px">${S.skills.length} of ${allSkills.length} · ${levelName[S.level] || 'Level not set'}</span></div>
      <div class="chips">${allSkills.map(s => `<span class="badge ${S.skills.includes(s)?'on':''}">${S.skills.includes(s) ? ic('check',14,2.6).replace('<svg','<svg style="stroke:currentColor"') : ''}${s}</span>`).join('')}</div>
    </section>
    <button class="btn ghost" data-act="reset">Reset demo data</button>
  </main>${tabs('projects')}`;
}

function levelSheet(){
  const opts = [['beginner','Beginner','First time decorating. Explain everything.'],['improver','Improver','Done a few rooms. Keep it clear but quick.'],['pro','Pro','Trade or very confident. Give me the detail.']];
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lvl-h"><div class="panel wrap">
    <h2 id="lvl-h" style="font-size:24px">How confident are you with decorating?</h2>
    <p class="muted" style="margin:0">We’ll pitch every guide at your level. You can switch any step between Beginner and Pro.</p>
    ${opts.map(([id,l,d]) => `<button class="opt" data-act="setlevel" data-l="${id}" aria-pressed="${S.level===id}"><span class="t"><b>${l}</b><small>${d}</small></span></button>`).join('')}
  </div></div>`;
}

// ---------- render ----------
let confirmReset = false;
function render(){
  const r = route(); let html;
  let m;
  if (r === 'home') html = vHome();
  else if (r === 'diagnose') html = vDiagnose();
  else if (r === 'products') html = vProducts();
  else if (r === 'stores') html = vStores();
  else if (r === 'projects') html = vProjects();
  else if ((m = r.match(/^guide-([a-z]+)$/))) html = vGuide(m[1]);
  else if ((m = r.match(/^step-([a-z]+)-(\d+)$/))) html = vStep(m[1], +m[2]);
  else if ((m = r.match(/^done-([a-z]+)$/)) && G[m[1]]) html = vDone(m[1]);
  else html = vHome();
  document.getElementById('app').innerHTML = html;
  document.getElementById('layer').innerHTML = S.level ? '' : levelSheet();
}
let lastRoute = route();
window.addEventListener('hashchange', () => {
  const r = route();
  if (!r.startsWith('step-') || !lastRoute.startsWith('step-') || r.split('-')[1] !== lastRoute.split('-')[1]) ui.mode = null;
  lastRoute = r; render(); window.scrollTo(0,0);
});

// ---------- events ----------
document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-go]'); if (goEl) { go(goEl.dataset.go); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (el.tagName === 'INPUT') return;
  if (a === 'level') { document.getElementById('layer').innerHTML = levelSheet(); }
  else if (a === 'setlevel') { S.level = el.dataset.l; save(); document.getElementById('layer').innerHTML = ''; render(); toast('Level set to ' + levelName[S.level]); }
  else if (a === 'notify') { S.notify = !S.notify; save(); render(); if (S.notify) toast('We’ll let you know when Woodwork is ready'); }
  else if (a === 'pick') { ui.quiz = {problem: el.dataset.id, answer: null}; render(); const t = document.querySelector('.card .eyebrow') || document.getElementById('plan'); t && t.closest('section').scrollIntoView({behavior:'smooth', block:'start'}); }
  else if (a === 'answer') { ui.quiz.answer = +el.dataset.i; render(); const p = document.getElementById('plan'); p && p.scrollIntoView({behavior:'smooth', block:'start'}); }
  else if (a === 'addmissing') { const g = G[el.dataset.g]; let n = 0; g.kit.forEach(k => { const nm = kitName(k); if (!S.have[el.dataset.g + '|' + nm] && !inList(nm)) { addToList(nm); n++; } }); save(); toast(n ? n + ' added to your shopping list' : 'Already on your list'); }
  else if (a === 'mode') { ui.mode = el.dataset.m; render(); }
  else if (a === 'starttimer') { const g = el.dataset.g, i = +el.dataset.i, s = G[g].steps[i]; S.timers = S.timers.filter(t => t.id !== g + '-' + i); const end = Date.now() + s.timer*60000; S.timers.push({id: g + '-' + i, label: s.timerLabel, end}); if (N) N.scheduleTimer(g + '-' + i, s.timerLabel, end); save(); render(); toast(N ? 'Timer started. We’ll notify you when it’s done.' : 'Timer started. It’s in My jobs too.'); }
  else if (a === 'stoptimer') { if (N) N.cancelTimer(el.dataset.id); S.timers = S.timers.filter(t => t.id !== el.dataset.id); save(); render(); }
  else if (a === 'next') { const g = el.dataset.g, i = +el.dataset.i; const d = done(g); if (!d.includes(i)) d.push(i); S.progress[g] = d;
    if (i >= G[g].steps.length - 1) { if (!S.skills.includes(G[g].skill)) S.skills.push(G[g].skill); S.last = null; save(); go('done-' + g); }
    else { save(); go('step-' + g + '-' + (i + 2)); } }
  else if (a === 'speak') { if (N) { N.speak(document.querySelector('h1.h1').textContent + '. ' + document.getElementById('instr').innerText); return; } try { const s = new SpeechSynthesisUtterance(document.querySelector('h1.h1').textContent + '. ' + document.getElementById('instr').innerText); speechSynthesis.cancel(); speechSynthesis.speak(s); } catch(err) { toast('Read-aloud isn’t available here'); } }
  else if (a === 'pfilter') { ui.pfilter = el.dataset.f; render(); }
  else if (a === 'sfilter') { ui.sfilter = el.dataset.f; render(); }
  else if (a === 'addp') { const n = P[el.dataset.id].name; if (inList(n)) { S.list = S.list.filter(i => i.name !== n); toast('Removed from your list'); } else { addToList(n); toast('Added to your shopping list'); } save(); render(); }
  else if (a === 'addsys') { ['zmk','bin','pw'].forEach(id => addToList(P[id].name)); save(); render(); toast('Mould system added to your list'); }
  else if (a === 'rm') { e.preventDefault(); S.list.splice(+el.dataset.k, 1); save(); render(); }
  else if (a === 'copylist') { const txt = 'Shopping list\n' + S.list.filter(i => !i.got).map(i => '- ' + i.name).join('\n');
    if (N) { N.share(txt); return; } const ok = () => toast('List copied'); try { navigator.clipboard.writeText(txt).then(ok, () => toast('Couldn’t copy. Long-press the list to select it.')); } catch(err) { toast('Couldn’t copy. Long-press the list to select it.'); } }
  else if (a === 'reset') { if (!confirmReset) { confirmReset = true; el.textContent = 'Tap again to clear everything'; setTimeout(() => { confirmReset = false; }, 4000); return; }
    confirmReset = false; if (N) S.timers.forEach(t => N.cancelTimer(t.id)); S = JSON.parse(JSON.stringify(defaults)); save(); ui.photo = null; render(); toast('Demo data cleared'); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'photo-in' && el.files && el.files[0]) { const fr = new FileReader(); fr.onload = () => { ui.photo = fr.result; render(); }; fr.readAsDataURL(el.files[0]); return; }
  const a = el.dataset && el.dataset.act;
  if (a === 'have') { S.have[el.dataset.key] = el.checked; save(); render(); }
  else if (a === 'got') { S.list[+el.dataset.k].got = el.checked; save(); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'search') { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById('psearch'); s.focus(); try { s.setSelectionRange(pos,pos); } catch(err) {} }
});

// live timers
setInterval(() => { document.querySelectorAll('[data-timer]').forEach(n => { n.textContent = fmt(+n.dataset.timer - Date.now()); }); }, 1000);

render();
})();
</script>
</body>
